[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "web-portal"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.14"
license = "AGPL-3.0-only"
keywords = []
authors = [
  { name = "Leo Spratt", email = "contact@enchantedcode.co.uk" },
]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "quart~=0.20.0",
  "quart-auth~=0.11.0",
  "tortoise-orm[aiomysql]~=0.25.3",
  "pydantic~=2.12.5",
  "pydantic-settings~=2.12.0",
  "web-health-checker~=1.3.1",
  "packaging~=25.0",
  "pillow~=12.0.0"
]

[tool.hatch.envs.default.scripts]
serve = "hypercorn \"web_portal.main:create_app()\""
deps = ""

[tool.hatch.envs.docs]
dependencies = [
  "zensical~=0.0.13",
  "mkdocstrings[python]~=1.0.0",
]

[tool.hatch.envs.docs.scripts]
build = "zensical build --clean"
serve = "zensical serve"

[tool.hatch.envs.dev]
dependencies = [
  "pytest~=9.0.2",
  "pytest-asyncio~=1.3.0",
  "pytest-env~=1.2.0",
  "playwright~=1.57.0",
  "pytest-playwright~=0.7.2"
]

[tool.hatch.envs.dev.scripts]
unit-test = "pytest ./tests/test_core"
e2e-test = "pytest --tracing=retain-on-failure --browser chromium ./tests/test_e2e.py"
e2e-deps = "playwright install --with-deps chromium"
lint = "hatch fmt --check"

[project.urls]
Documentation = "https://webportal.docs.enchantedcode.co.uk/"
Issues = "https://github.com/enchant97/web-portal/issues"
Source = "https://github.com/enchant97/web-portal"

[tool.hatch.version]
path = "web_portal/__init__.py"

[tool.ruff]
line-length=100
src = ["web_portal", "tests"]
lint.ignore = ["EM101", "EM102", "TRY003", "N818"]

[tool.ruff.lint.per-file-ignores]
"web_portal/plugin_api.py" = ["F401"]
"scripts/hash_password.py" = ["T201"]
"plugins/*" = ["TID252"]
"tests/*" = ["S101", "TRY002", "S310", "PT003"]

[tool.pytest.ini_options]
asyncio_mode="strict"
asyncio_default_fixture_loop_scope = "session"
env = [
  "DB_URI=sqlite://:memory:",
  "DATA_PATH=./data",
  "SECRET_KEY=pytest-testing",
  "SECURE_COOKIES=0",
]
