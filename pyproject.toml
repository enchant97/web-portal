[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[project]
name = "web-portal"
description = ''
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "AGPL-3.0-only"
version = "2.5.0"
keywords = []
authors = [
  { name = "Leo Spratt", email = "contact@enchantedcode.co.uk" },
]
classifiers = [
  "Private :: Do Not Upload",
  "Development Status :: 5 - Production/Stable",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
  "quart~=0.23.1",
  "quart-auth~=0.12.0",
  "tortoise-orm[aiomysql]~=0.25.4",
  "pydantic~=2.14.0",
  "pydantic-settings~=2.15.0",
  "web-health-checker~=1.3.1",
  "packaging~=26.3",
  "pillow~=13.0.0"
]

[dependency-groups]
test = [
  "pytest~=9.1.1",
  "pytest-asyncio~=1.4.0",
  "pytest-env~=1.7.1",
  "playwright~=1.63.0",
  "pytest-playwright~=0.10.0"
]
docs = [
  "zensical~=0.0.73",
  "mkdocstrings-python~=2.0",
]
dev = [
  "poethepoet",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = ""

[tool.poe.tasks]
serve = "hypercorn \"web_portal.main:create_app()\""
docs-build = "uv run --group docs --no-default-groups zensical build --clean"
docs-serve = "uv run --group docs --no-default-groups zensical serve"
test-unit = "uv run --group test pytest ./tests/test_core"
test-e2e = "uv run --group test pytest --tracing=retain-on-failure --browser chromium ./tests/test_e2e.py"
test-e2e-deps = "uv run --group test playwright install --with-deps chromium"
lint-check = "uvx ruff format --check"
lint = "uvx ruff format"

[project.urls]
Documentation = "https://webportal.docs.enchantedcode.co.uk/"
Issues = "https://github.com/enchant97/web-portal/issues"
Source = "https://github.com/enchant97/web-portal"

[tool.ruff]
line-length=100
src = ["web_portal", "tests"]
lint.ignore = ["EM101", "EM102", "TRY003", "N818"]

[tool.ruff.lint.per-file-ignores]
"web_portal/plugin_api.py" = ["F401"]
"scripts/hash_password.py" = ["T201"]
"plugins/*" = ["TID252"]
"tests/*" = ["S101", "TRY002", "S310", "PT003"]

[tool.pytest.ini_options]
asyncio_mode="strict"
asyncio_default_fixture_loop_scope = "session"
env = [
  "DB_URI=sqlite://:memory:",
  "DATA_PATH=./data",
  "SECRET_KEY=pytest-testing",
  "SECURE_COOKIES=0",
]
